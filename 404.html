<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — RecyNet</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4fdf4;
      color: #263b26;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 560px;
      padding: clamp(24px, 6vw, 48px);
      background: #fff;
      border: 1px solid #c8e6c9;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgb(27 94 32 / 10%);
    }
    .brand { margin: 0 0 24px; color: #1b5e20; font-size: 1.25rem; font-weight: 700; }
    .code { margin: 0; color: #1b5e20; font-size: 3rem; font-weight: 800; line-height: 1.2; }
    h1 { margin: 12px 0; color: #1b5e20; font-size: clamp(1.6rem, 6vw, 2rem); line-height: 1.25; }
    .message { margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      background: #1b5e20;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #143f18; text-decoration: underline; }
    a:focus-visible { outline: 3px solid #174d89; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">RecyNet</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p class="message">Esse endereço não existe ou a página foi movida. Confira o endereço ou volte para a página inicial.</p>
    <a href="https://recynet.app/">Voltar ao início</a>
  </main>
</body>
</html>
