<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico — RecyNet</title><link rel="stylesheet" href="assets/css/design-system.css"><link rel="stylesheet" href="assets/css/components.css">
</head><body><main class="container" style="padding:2rem 1rem">
<h1>Diagnóstico administrativo</h1><p>Esta página consulta os dados locais sem alterá-los.</p>
<h2>Armazenamento</h2><p id="storageState" role="status"></p><ul id="accountList"></ul>
<h2>Sessão</h2><p id="sessionState"></p>
<p><a href="teste-debug-completo.html">Executar testes isolados</a> · <a href="recuperar-dados.html">Restaurar backup</a> · <a href="admin.html">Voltar ao painel</a></p>
</main><script src="assets/js/database.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/utils.js"></script><script>
function atualizarDiagnostico(){
 const admin=RecyNetAuth.protegerAdmin();if(!admin)return;
 const estado=RecyNetDB.lerUsuarios();
 document.getElementById('storageState').textContent=estado.erro || `${estado.usuarios.filter(u=>u.tipo==='user').length} contas de cooperados salvas.`;
 document.getElementById('accountList').textContent='';
 for(const usuario of estado.usuarios.filter(u=>u.tipo==='user')) {const li=document.createElement('li');li.textContent=`${usuario.nome} — ${usuario.email}`;document.getElementById('accountList').appendChild(li);}
 document.getElementById('sessionState').textContent=`${admin.nome} (${admin.email}), administrador.`;
}
document.addEventListener('DOMContentLoaded',atualizarDiagnostico);
RecyNetUtils.aoAtualizarDados(atualizarDiagnostico);
</script></body></html>
